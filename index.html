<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organiza QM</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#102d4f;font-family:Arial,sans-serif;color:#15213b}.box{width:min(430px,calc(100% - 36px));background:#fff;border-radius:20px;padding:32px;box-shadow:0 20px 55px #0007}.tag{font-size:12px;letter-spacing:.12em;font-weight:700;color:#476786}h1{font-size:29px;margin:10px 0}p{color:#60758a;line-height:1.45}label{display:block;font-weight:bold;margin-top:14px}input{display:block;width:100%;padding:12px;border:1px solid #cbd6e0;border-radius:8px;margin-top:6px;font-size:16px}button{border:0;border-radius:8px;padding:12px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:18px;width:100%}#enter{background:#2164e8;color:#fff}#create{background:#eaf0fa;color:#15213b;margin-top:9px}.error{min-height:20px;color:#bd4251;margin:12px 0 0}.note{font-size:13px;margin-top:18px}</style></head>
<body><main class="box"><div class="tag">ORGANIZA QM · OPERACIONES</div><h1>Ingresar al equipo</h1><p>La información operativa se carga después de validar tu usuario.</p><label>Correo<input id="email" type="email" autocomplete="email"></label><label>Contraseña<input id="password" type="password" autocomplete="current-password"></label><p id="message" class="error"></p><button id="enter">Ingresar</button><button id="create">Crear mi acceso</button><p class="note">Usá una contraseña personal. Solo los usuarios aprobados pueden entrar.</p></main>
<script>
const key='sb_publishable_i9nsPiNEpt4_uQbsHfALvg_r1LO0Is5';
const base='https://setoihnjqcebdeieteba.supabase.co';
const endpoint=base+'/functions/v1/organiza';
const message=t=>document.querySelector('#message').textContent=t;
const hashRecovery=new URLSearchParams(location.hash.slice(1));
const queryRecovery=new URLSearchParams(location.search);
const recovery=hashRecovery.get('access_token')?hashRecovery:queryRecovery;
const recoveryToken=recovery.get('access_token');
const recoveryRequested=recovery.get('type')==='recovery';
const recoveryMode=recoveryRequested&&recoveryToken;
async function auth(path,body){const r=await fetch(base+path,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify(body)});return {r,data:await r.json().catch(()=>({}))}}
async function login(email,password){const {r,data}=await auth('/auth/v1/token?grant_type=password',{email,password});if(!r.ok)throw new Error(data.error_description||data.message||'No se pudo ingresar.');return data}
function decode(base64){const raw=atob(base64),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
async function open(session){localStorage.setItem('organiza_supabase_session',JSON.stringify(session));const r=await fetch(endpoint,{headers:{Authorization:'Bearer '+session.access_token}}),data=await r.json().catch(()=>({}));if(!r.ok||!data.html)throw new Error(data.error||'No se pudo abrir la aplicación.');let app=decode(data.html);app=app.replace("Object.entries(remote).forEach(([k,v])=>localStorage.setItem(k,v));location.reload();return","Object.entries(remote).forEach(([k,v])=>localStorage.setItem(k,v));if(!sessionStorage.getItem('organiza_remote_reload_done')){sessionStorage.setItem('organiza_remote_reload_done','1');location.reload();return}");document.open();document.write(app);document.close()}
async function access(create){const email=document.querySelector('#email').value.trim().toLowerCase(),password=document.querySelector('#password').value;if(!email||!password)return message('Ingresá correo y contraseña.');try{let session;message(create?'Preparando tu acceso...':'Ingresando...');try{session=await login(email,password)}catch(error){if(!create||!/invalid login credentials/i.test(error.message))throw error;message('Creando tu acceso...');const {r,data}=await auth('/auth/v1/signup',{email,password});if(!r.ok&&!String(data.message||data.msg||'').toLowerCase().includes('already registered'))throw new Error(data.error_description||data.message||'No se pudo crear el acceso.');session=await login(email,password)}await open(session)}catch(error){message(error.message||'No se pudo conectar.')}}
document.querySelector('#enter').onclick=()=>access(false);document.querySelector('#create').onclick=()=>access(true);
async function finishRecovery(){const password=document.querySelector('#newPassword').value,confirm=document.querySelector('#confirmPassword').value,notice=document.querySelector('#recoveryMessage');if(password.length<6)return notice.textContent='La contraseña debe tener al menos 6 caracteres.';if(password!==confirm)return notice.textContent='Las contraseñas no coinciden.';notice.textContent='Guardando contraseña...';try{const r=await fetch(base+'/auth/v1/user',{method:'PUT',headers:{apikey:key,Authorization:'Bearer '+recoveryToken,'Content-Type':'application/json'},body:JSON.stringify({password})}),data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||data.error_description||'No se pudo actualizar la contraseña.');history.replaceState({},document.title,location.pathname);document.querySelector('main').innerHTML='<div class="tag">ORGANIZA QM · OPERACIONES</div><h1>Contraseña lista</h1><p>Ya podés ingresar con tu correo y la nueva contraseña.</p><button id="goLogin">Ir al ingreso</button>';document.querySelector('#goLogin').onclick=()=>location.reload()}catch(error){notice.textContent=error.message||'No se pudo actualizar la contraseña.'}}
if(recoveryMode){document.querySelector('main').innerHTML='<div class="tag">ORGANIZA QM · OPERACIONES</div><h1>Crear contraseña</h1><p>Elegí una contraseña nueva para tu acceso.</p><label>Nueva contraseña<input id="newPassword" type="password" autocomplete="new-password"></label><label>Repetir contraseña<input id="confirmPassword" type="password" autocomplete="new-password"></label><p id="recoveryMessage" class="error"></p><button id="savePassword">Guardar contraseña</button><p class="note">Usá al menos 6 caracteres.</p>';document.querySelector('#savePassword').onclick=finishRecovery}else if(recoveryRequested){document.querySelector('main').innerHTML='<div class="tag">ORGANIZA QM · OPERACIONES</div><h1>Enlace de recuperación incompleto</h1><p>Volvé al correo y abrí el enlace “Reset password” desde Chrome. No copies ni reenvíes el enlace: contiene datos privados de tu acceso.</p><p class="note">Si vuelve a pasar, pedí un nuevo correo de recuperación.</p>'}else{try{const session=JSON.parse(localStorage.getItem('organiza_supabase_session')||'null');if(session?.access_token){message('Abriendo Organiza QM...');open(session).catch(error=>message(error.message||'Volvé a ingresar.'))}}catch{}}
</script></body></html>
